name: "Routine: Daily Repo Maintenance"

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  maintenance:
    name: Daily Maintenance Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check for outdated packages
        run: npm outdated --omit=dev || true
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate || true
      - name: Verify package-lock consistency
        run: npm run check:packages:offline
      - name: Run tests
        run: npm run test
      - name: Check for security advisories
        run: npm audit --omit=dev --audit-level=high || true
      - name: Verify build still works
        run: npm run build:client
      - name: Check bundle size
        run: |
          du -sh dist/public/assets/
          echo "Total build size: $(du -sh dist/public | cut -f1)"
